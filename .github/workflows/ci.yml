name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: version
        run: echo "value=$(sed -n 's/^pkgver=//p' packaging/arch/PKGBUILD)" >>"$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/build-package.yml
    with:
      version: ${{ needs.version.outputs.value }}
